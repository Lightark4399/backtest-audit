name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check src tests
      - name: unit tests
        run: python -m pytest
      # The wheel is installed by its distribution name, outside the repository,
      # so no repository-relative file and no editable-install path can rescue it.
      - name: wheel clean-install PIT and demo smoke test
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv /tmp/btca-wheel-smoke
          /tmp/btca-wheel-smoke/bin/pip install dist/backtest_credibility_audit-*.whl
          cd /tmp
          # Report provenance is read from distribution metadata, so the installed
          # wheel must answer to the distribution name and not only to `audit`.
          /tmp/btca-wheel-smoke/bin/python -c "from importlib.metadata import version; print(version('backtest-credibility-audit'))"
          /tmp/btca-wheel-smoke/bin/python -c "from audit.ingest.duckdb_store import BitemporalStore; BitemporalStore().close()"
          /tmp/btca-wheel-smoke/bin/btca --help
          /tmp/btca-wheel-smoke/bin/python -m audit.demo --outdir /tmp/btca-wheel-demo
      # The demo runs in CI as a smoke test: it exercises the whole pipeline
      # end to end, so a regression that unit tests miss still fails the build.
      - name: demo smoke test
        run: python -m audit.demo --outdir /tmp/demo_out
      - uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: /tmp/demo_out
