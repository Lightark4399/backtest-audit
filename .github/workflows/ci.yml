name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check src tests
      - name: unit tests
        run: python -m pytest
      # The demo runs in CI as a smoke test: it exercises the whole pipeline
      # end to end, so a regression that unit tests miss still fails the build.
      - name: demo smoke test
        run: python -m audit.demo --outdir /tmp/demo_out
      - uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: /tmp/demo_out
